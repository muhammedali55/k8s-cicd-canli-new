# /api/orders ile başlayan istekleri order-service Service'ine (8080) yönlendirir.
# Ör. curl http://localhost/api/orders -> demo-gateway -> order-service:8080
# İkinci kural: /info/orders isteğini URLRewrite ile servisin /api/info ucuna çevirir.
# Ör. curl http://localhost/info/orders -> order-service:8080/api/info (canlıda yeni sürümü görmek için)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  parentRefs:
    - name: demo-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/orders
      backendRefs:
        - name: order-service
          port: 8080
    # /info/orders -> /api/info (yol tamamen değiştirilir)
    - matches:
        - path:
            type: Exact
            value: /info/orders
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /api/info
      backendRefs:
        - name: order-service
          port: 8080
